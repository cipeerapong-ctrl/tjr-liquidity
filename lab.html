<main class="app lab" id="top">
  <div class="wrap">
    <header class="lab-head">
      <h1>แบบฝึกอ่านกราฟ liquidity</h1>
      <p class="t-lead">กราฟสุ่มใหม่ทุกข้อ ตัดสินใจเอง แล้วตรวจคำตอบตามที่คลิปสอน คะแนนวัดว่าตัดสินใจถูกตามขั้นตอน ไม่ได้วัดกำไร</p>
    </header>

    <div class="lab-bar">
      <div class="lab-tabs" role="tablist" aria-label="โหมดแบบฝึก" data-k="tabs">
        <button class="lab-tab" type="button" role="tab" id="tab-replay" data-mode="replay" aria-selected="true" aria-controls="lab-panel" tabindex="0">Replay</button>
        <button class="lab-tab" type="button" role="tab" id="tab-spot" data-mode="spot" aria-selected="false" aria-controls="lab-panel" tabindex="-1">Spot</button>
        <button class="lab-tab" type="button" role="tab" id="tab-sessions" data-mode="sessions" aria-selected="false" aria-controls="lab-panel" tabindex="-1">Sessions</button>
        <button class="lab-tab" type="button" role="tab" id="tab-quiz" data-mode="quiz" aria-selected="false" aria-controls="lab-panel" tabindex="-1">Quiz</button>
      </div>
      <div class="lab-score" data-k="score" role="status" aria-live="polite" aria-label="คะแนนของโหมดนี้"></div>
      <button class="ctrl" type="button" data-act="reset" aria-label="รีเซ็ตคะแนนของโหมดนี้">รีเซ็ตคะแนน</button>
    </div>

    <section id="lab-panel" class="lab-panel" role="tabpanel" aria-labelledby="tab-replay" tabindex="-1">
      <p class="lab-intro" data-k="intro"></p>
      <div class="lab-grid">
        <figure class="chart-frame lf" data-ui="chart" aria-label="กราฟจำลองของแบบฝึก">
          <div class="chart-frame__bar">
            <span class="chart-frame__sym" data-k="sym">NQ</span><span class="chart-frame__tf" data-k="tf">5m</span>
            <span class="sim-tag">จำลอง</span>
            <span class="chart-frame__meta" data-k="meta"></span>
          </div>
          <div class="chart-frame__canvas" data-k="host"></div>
          <div class="chart-frame__ctrls lf__ctrls" data-k="ctrls"></div>
        </figure>
        <aside class="lab-side" aria-label="โจทย์และผลตรวจ">
          <div class="lab-card" data-k="prompt"></div>
          <div class="lab-choices" data-k="choices"></div>
          <div class="lab-card lab-fb" data-k="fb" role="status" aria-live="polite" hidden></div>
          <div class="lab-card lab-out" data-k="out" hidden></div>
          <button class="ctrl lab-next" type="button" data-act="next" hidden>ข้อใหม่</button>
        </aside>
      </div>
      <p class="lab-nojs" data-k="nojs">หน้านี้ต้องใช้ JavaScript เพื่อสร้างกราฟ เปิดสคริปต์แล้วโหลดหน้าใหม่</p>
    </section>
  </div>
</main>
